# Labels a pull request by the parts of the code it touches. The crate map
# is in CONTRIBUTING.md under "How it is built".

ui:
  - changed-files:
      - any-glob-to-any-file: ["app/src/ui/**", "app/data/**"]

app:
  - changed-files:
      - all-globs-to-any-file: ["app/**", "!app/src/ui/**", "!app/data/**"]

sync:
  - changed-files:
      - any-glob-to-any-file: ["sync/**"]

store:
  - changed-files:
      - any-glob-to-any-file: ["store/**"]

gmail:
  - changed-files:
      - any-glob-to-any-file: ["gmail/**"]

domain:
  - changed-files:
      - any-glob-to-any-file: ["domain/**"]

assistant:
  - changed-files:
      - any-glob-to-any-file: ["ai/**", "app/src/assistant/**"]

crypto:
  - changed-files:
      - any-glob-to-any-file: ["pgp/**", "smime/**", "app/src/pgp.rs", "app/src/smime.rs"]

cli:
  - changed-files:
      - any-glob-to-any-file: ["cli/**"]

translations:
  - changed-files:
      - any-glob-to-any-file: ["po/**"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md", "CONTEXT.md"]

build:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "scripts/**", "Cargo.toml", "Cargo.lock", "*/Cargo.toml", "*/build.rs"]

# Files that run during a build or a release, decide which code goes in, or
# ship with the app. A change here gets a maintainer's line-by-line read.
security-review:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "**/build.rs"
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "deny.toml"
          - "scripts/**"
          - "packaging/**"
          - "snap/**"
          - "app/data/**"
          - "rust-toolchain*"
