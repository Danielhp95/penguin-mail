name: PR checks

# Checks on what a change brings in rather than on whether the code works:
# the crates and their licences, the workflows themselves, and anything in a
# pull request a reviewer should read twice. CI's build and tests are in
# ci.yml.
#
# Every job runs with a read-only token and no secrets, so a pull request
# from a fork gets the same checks. The tools come from pinned releases
# whose sha256 sums are written below. To update one, download the new
# release, check its sum, and change the version and the sum together.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - deny.toml
      - ".github/**"
  # New advisories appear without any change here.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

jobs:
  deny:
    name: Crates, sources and licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/deny.tar.gz" \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      # deny.toml says what passes. --locked fails rather than let cargo
      # rewrite a Cargo.lock that no longer matches the manifests.
      - name: Check
        run: cargo deny --locked check --show-stats

  dependency-review:
    name: New dependencies with known vulnerabilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub's advisory database, for crates and for actions. It posts no
      # comment on the pull request, which would need a token that writes.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" \
              "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      # The read-only token lets zizmor ask GitHub whether each pinned
      # commit belongs to the action it claims to be and whether that
      # version has a known vulnerability.
      - name: Check the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" --format github .github/'

  review-notes:
    name: Notes for the reviewer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The merge commit and its first parent, the tip of the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Writes the list to the run's summary page. It fails only on a
      # binary file outside docs/, app/data/ and testmail/, or a crate from
      # anywhere but crates.io; the rest is for a person to read.
      - name: List what to read closely
        run: python3 scripts/pr-review-summary.py HEAD^1 HEAD
