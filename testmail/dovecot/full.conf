# The Full profile: every extension Dovecot 2.4.5 offers, and an Archive
# mailbox with its SPECIAL-USE flag, which the image's defaults lack.

# Room for a test's two clients at once. The client keeps to 3 itself.
mail_max_userip_connections = 20

# POP3 for the POP3 client and downloader tests: STLS on 31110 and TLS
# from the first byte on 31995.
protocols {
  pop3 = yes
}

namespace inbox {
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# A 1 GiB quota counted from the mailboxes, so GETQUOTAROOT has something
# to say. Dovecot 2.4 names the quota in a filter and drops the quota_
# prefix inside it; count is the default driver.
mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota "User quota" {
  storage_size = 1G
}
